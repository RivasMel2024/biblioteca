openapi: 3.0.3
info:
  title: Biblioteca API
  version: 1.0.0
  description: |
    Documentacion OpenAPI para la API de biblioteca (Laravel + Sanctum).
    Incluye autenticacion Bearer, ejemplos de peticiones/respuestas y estructuras paginadas.
  contact:
    name: ''
    url: ''
    email: ''
  termsOfService: ''
  license:
    name: ''
    url: ''
servers:
  - url: 'http://localhost:8000'
    description: Local Statgin
  - url: 'http://backend-practica4.test'
    description: Local domain
  - url: 'http://127.0.0.1:8081/api'
    description: Development
tags:
  - name: Auth
    description: 'Registro, login, perfil y cierre de sesion.'
  - name: Users
    description: Gestion de usuarios (principalmente admin).
  - name: Categories
    description: CRUD de categorias o generos literarios.
  - name: Books
    description: CRUD de libros y consulta de copias disponibles.
  - name: Loans
    description: Gestion de prestamos y devoluciones.
  - name: Fines
    description: Consulta y pago de multas.
security:
  - bearerAuth: []
paths:
  /v1/register:
    post:
      tags:
        - Auth
      summary: Register user
      description: Crea un usuario y devuelve un token de acceso.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              registerStudent:
                $ref: '#/components/examples/RegisterStudentRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                registered:
                  $ref: '#/components/examples/RegisterResponseOk'
        '422':
          $ref: '#/components/responses/ValidationError'
      security: []
  /v1/login:
    post:
      tags:
        - Auth
      summary: Login
      description: Autentica al usuario y devuelve token Bearer.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              loginDefault:
                $ref: '#/components/examples/LoginRequestDefault'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  $ref: '#/components/examples/LoginResponseOk'
        '422':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                invalidCredentials:
                  value:
                    message: Invalid credentials
  /v1/logout:
    post:
      tags:
        - Auth
      summary: Logout and revoke all tokens
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/profile:
    get:
      tags:
        - Auth
      summary: Get authenticated user profile
      operationId: getProfile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
                required:
                  - user
              examples:
                profile:
                  $ref: '#/components/examples/ProfileResponseOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/users:
    get:
      tags:
        - Users
      summary: List users (admin only)
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: role
          schema:
            $ref: '#/components/schemas/RoleName'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/users/{user}':
    get:
      tags:
        - Users
      summary: Get user by ID
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Users
      summary: Update user
      operationId: updateUserPut
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags:
        - Users
      summary: Partially update user
      operationId: updateUserPatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Users
      summary: Delete user
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/categories:
    get:
      tags:
        - Categories
      summary: List categories
      operationId: listCategories
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategories'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Categories
      summary: Create category
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  '/v1/categories/{category}':
    get:
      tags:
        - Categories
      summary: Get category by ID
      operationId: getCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Categories
      summary: Update category
      operationId: updateCategoryPut
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags:
        - Categories
      summary: Partially update category
      operationId: updateCategoryPatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Categories
      summary: Delete category
      operationId: deleteCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/books:
    get:
      tags:
        - Books
      summary: List books
      operationId: listBooks
      parameters:
        - in: query
          name: title
          schema:
            type: string
        - in: query
          name: isbn
          schema:
            type: string
        - in: query
          name: category_id
          schema:
            type: integer
        - in: query
          name: is_available
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBooks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Books
      summary: Create book
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBookRequest'
            examples:
              createBook:
                $ref: '#/components/examples/CreateBookRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
              examples:
                created:
                  $ref: '#/components/examples/BookCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  '/v1/books/{book}':
    get:
      tags:
        - Books
      summary: Get book by ID
      operationId: getBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Book detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Books
      summary: Update book
      operationId: updateBookPut
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags:
        - Books
      summary: Partially update book
      operationId: updateBookPatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Books
      summary: Delete book
      operationId: deleteBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Book deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Book has active loans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  '/v1/books/{book}/copies':
    get:
      tags:
        - Books
      summary: Get available copies for a book
      operationId: getBookCopies
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Available copies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookCopy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/loans:
    get:
      tags:
        - Loans
      summary: List loans
      operationId: listLoans
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - returned
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated loans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLoans'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Loans
      summary: Create loan
      operationId: createLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreLoanRequest'
            examples:
              createLoan:
                $ref: '#/components/examples/CreateLoanRequest'
      responses:
        '201':
          description: Loan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
              examples:
                created:
                  $ref: '#/components/examples/LoanCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  '/v1/loans/{loan}':
    get:
      tags:
        - Loans
      summary: Get loan by ID
      operationId: getLoan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoanId'
      responses:
        '200':
          description: Loan detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  '/v1/loans/{loan}/return':
    post:
      tags:
        - Loans
      summary: Return loan and generate fine if overdue
      operationId: returnLoan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoanId'
      responses:
        '200':
          description: Loan returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnLoanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Loan already returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/fines:
    get:
      tags:
        - Fines
      summary: List fines
      operationId: listFines
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - PENDIENTE
              - PAGADA
              - CONDONADA
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated fines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFines'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/fines/{fine}':
    get:
      tags:
        - Fines
      summary: Get fine by ID
      operationId: getFine
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FineId'
      responses:
        '200':
          description: Fine detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  '/v1/fines/{fine}/pay':
    post:
      tags:
        - Fines
      summary: Pay a fine
      operationId: payFine
      parameters:
        - $ref: '#/components/parameters/FineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayFineRequest'
            examples:
              cashPayment:
                $ref: '#/components/examples/PayFineRequestCash'
      responses:
        '200':
          description: Fine paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayFineResponse'
              examples:
                paid:
                  $ref: '#/components/examples/PayFineResponseOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Invalid amount or fine already processed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - $ref: '#/components/schemas/PayFineAmountErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: digest
      bearerFormat: Token
  parameters:
    UserId:
      in: path
      name: user
      required: true
      schema:
        type: integer
    CategoryId:
      in: path
      name: category
      required: true
      schema:
        type: integer
    BookId:
      in: path
      name: book
      required: true
      schema:
        type: integer
    LoanId:
      in: path
      name: loan
      required: true
      schema:
        type: integer
    FineId:
      in: path
      name: fine
      required: true
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            validationError:
              $ref: '#/components/examples/ValidationErrorGeneric'
  examples:
    RegisterStudentRequest:
      summary: Registro de estudiante
      value:
        name: Ana Perez
        email: ana@example.com
        password: secret123
        password_confirmation: secret123
        role: estudiante
    RegisterResponseOk:
      summary: Registro exitoso
      value:
        message: Usuario registrado exitosamente.
        access_token: 1|token_generado
        token_type: Bearer
        user:
          id: 12
          name: Ana Perez
          email: ana@example.com
          email_verified_at: null
          created_at: '2026-04-07T13:10:25.000000Z'
          updated_at: '2026-04-07T13:10:25.000000Z'
          roles:
            - id: 3
              name: estudiante
              guard_name: web
    LoginRequestDefault:
      summary: Login basico
      value:
        email: admin@example.com
        password: secret123
    LoginResponseOk:
      summary: Login exitoso
      value:
        access_token: 1|token_login
        token_type: Bearer
        user:
          id: 1
          name: Admin
          email: admin@example.com
          email_verified_at: null
          created_at: '2026-03-01T11:00:00.000000Z'
          updated_at: '2026-03-01T11:00:00.000000Z'
          roles:
            - id: 1
              name: admin
              guard_name: web
    ProfileResponseOk:
      summary: Perfil autenticado
      value:
        user:
          id: 1
          name: Admin
          email: admin@example.com
          email_verified_at: null
          created_at: '2026-03-01T11:00:00.000000Z'
          updated_at: '2026-03-01T11:00:00.000000Z'
          roles:
            - id: 1
              name: admin
              guard_name: web
    CreateBookRequest:
      summary: Crear libro con copias
      value:
        title: Clean Code
        description: Manual de buenas practicas de desarrollo.
        ISBN: '9780132350884'
        category_id: 2
        total_copies: 5
    BookCreatedResponse:
      summary: Libro creado
